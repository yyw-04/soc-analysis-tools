[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-c2-tools"
version = "2.1.0"
description = "Automatic defensive PCAP analysis and offline C2 cryptography tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yyw-04"}]
dependencies = ["cryptography>=42,<48"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
c2-pcap-analyzer = "soc_c2.cli:main"
c2-crypto-helper = "soc_c2.crypto_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soc_c2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
